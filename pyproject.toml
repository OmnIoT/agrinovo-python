[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agrinovo"
version = "0.9.0"
description = "Read Agrinovo water, soil and air sensors over RS485 from a Raspberry Pi or PC."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agrinovo", email = "contact@agrinovo.io" }]
keywords = ["agrinovo", "sensor", "rs485", "modbus", "raspberry pi", "water quality", "pH", "dissolved oxygen", "conductivity", "nitrate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[project.urls]
Homepage = "https://agrinovo.io"
Source = "https://github.com/OmnIoT/agrinovo-python"
Issues = "https://github.com/OmnIoT/agrinovo-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agrinovo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
